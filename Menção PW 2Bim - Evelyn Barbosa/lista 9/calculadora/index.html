<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Rosa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Calculadora</h1>
    </header>

<div class="container">
    <img src="calculadora.png" alt="">

    <div class="calculadora">

    <div class="telinha"></div>

    <div class="teclas">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>÷</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>×</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>-</button>

        <button>0</button>
        <button>00</button>
        <button>.</button>
        <button>+</button>

        <button class="igual">=</button>
    </div>

</div>

</div>

</body>
</html>
